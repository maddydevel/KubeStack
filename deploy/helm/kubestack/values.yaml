image:
  registry: ""          # your mirror, e.g. registry.example.internal
  repository: kubestack/kubestack-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

adminGroup: kubestack-admins

oidc:
  issuer: ""            # must be reachable on the private network
  clientID: ""
  groupsClaim: groups
  # Built-in portal login (authorization code + PKCE). Leave empty to use an OIDC-aware proxy instead.
  redirectURL: ""       # e.g. https://kubestack.example.internal/auth/callback
  clientSecretSecret: "" # Secret with key CLIENT_SECRET; omit for a public client
  # Public client used by kubectl (kubelogin) for direct cluster access; defaults to clientID.
  cliClientID: ""

# Secret holding key DATABASE_URL (postgres://...). Required for a durable audit trail.
databaseSecret: ""

# Install into Rancher's local cluster and use the in-cluster service account (recommended),
# or set to a Secret containing key "kubeconfig" for a remote local cluster.
rancherKubeconfigSecret: ""

service:
  port: 80
