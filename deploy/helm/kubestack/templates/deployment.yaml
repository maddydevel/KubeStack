{{- if not .Values.oidc.issuer }}{{ fail "oidc.issuer is required" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubestack-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kubestack-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kubestack-api}
    spec:
      serviceAccountName: kubestack-api
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "{{ with .Values.image.registry }}{{ . }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: KUBESTACK_ENGINE, value: rancher}
            - {name: KUBESTACK_ADMIN_GROUP, value: {{ .Values.adminGroup | quote }}}
            - {name: KUBESTACK_OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }}}
            - {name: KUBESTACK_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientID | quote }}}
            - {name: KUBESTACK_OIDC_GROUPS_CLAIM, value: {{ .Values.oidc.groupsClaim | quote }}}
            {{- with .Values.oidc.cliClientID }}
            - {name: KUBESTACK_OIDC_CLI_CLIENT_ID, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.oidc.redirectURL }}
            - {name: KUBESTACK_OIDC_REDIRECT_URL, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.oidc.clientSecretSecret }}
            - name: KUBESTACK_OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ . }}, key: CLIENT_SECRET}}
            {{- end }}
            {{- with .Values.databaseSecret }}
            - name: KUBESTACK_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ . }}, key: DATABASE_URL}}
            {{- end }}
            {{- if .Values.rancherKubeconfigSecret }}
            - {name: KUBESTACK_RANCHER_KUBECONFIG, value: /etc/kubestack/rancher/kubeconfig}
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          {{- if .Values.rancherKubeconfigSecret }}
          volumeMounts: [{name: rancher, mountPath: /etc/kubestack/rancher, readOnly: true}]
      volumes:
        - name: rancher
          secret: {secretName: {{ .Values.rancherKubeconfigSecret }}}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubestack-api
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: kubestack-api}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
