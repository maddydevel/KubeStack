openapi: 3.0.3
info: {title: KubeStack API, version: v1}
# Source of truth for the HTTP API. portal/src/api.ts mirrors these types.
# Either credential works. Cookie-authenticated non-GET requests must also send "X-KubeStack-Request: 1"
# (CSRF). The cookie is set by the portal login flow: GET /auth/login -> IdP -> GET /auth/callback;
# POST /auth/logout clears it. Those three endpoints exist only when KUBESTACK_OIDC_REDIRECT_URL is set.
security: [{bearer: []}, {session: []}]
paths:
  /api/v1/me:
    get: {summary: The signed-in user, responses: {"200": {description: user, content: {application/json: {schema: {type: object, properties: {name: {type: string}, admin: {type: boolean}}}}}}, "401": {$ref: "#/components/responses/Error"}}}
  /api/v1/versions:
    get: {summary: Release catalog, responses: {"200": {description: versions, content: {application/json: {schema: {type: array, items: {type: string}}}}}}}
  /api/v1/clusters:
    get:
      summary: List clusters
      responses: {"200": {description: clusters, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Cluster"}}}}}}
    post:
      summary: Create an RKE2 cluster (admin group)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateRequest"}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/v1/clusters/import:
    post:
      summary: Attach an existing cluster (admin group); then GET its registration to connect it
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/v1/clusters/{id}/registration:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: How to join nodes (provisioned) or connect the agent (attached). Contains no secret (admin group)
      responses:
        "200": {description: registration, content: {application/json: {schema: {$ref: "#/components/schemas/Registration"}}}}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/clusters/{id}/access:
    parameters: [{$ref: "#/components/parameters/id"}]
    get:
      summary: Direct-access connection info for the user's own IdP identity (no credentials; any signed-in user)
      responses:
        "200": {description: access, content: {application/json: {schema: {$ref: "#/components/schemas/Access"}}}}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/clusters/{id}/snapshots:
    parameters: [{$ref: "#/components/parameters/id"}]
    get: {summary: etcd snapshots, responses: {"200": {description: snapshots, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Snapshot"}}}}}}}
    post: {summary: Take an etcd snapshot now (admin group, provisioned tier), responses: {"202": {description: requested}, "409": {$ref: "#/components/responses/Error"}}}
  /api/v1/clusters/{id}/restore:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      summary: Restore etcd data from a successful snapshot of this cluster; version and config are kept (admin group, destructive)
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [snapshot], properties: {snapshot: {type: string}}}}}}
      responses: {"202": {description: requested}, "409": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}}
  /api/v1/clusters/{id}/nodes:
    parameters: [{$ref: "#/components/parameters/id"}]
    get: {summary: Nodes (machines), responses: {"200": {description: nodes, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Node"}}}}}}}
  /api/v1/clusters/{id}/nodes/{node}:
    parameters: [{$ref: "#/components/parameters/id"}, {name: node, in: path, required: true, schema: {type: string}}]
    delete:
      summary: Drain and remove a node; refuses the last etcd or control-plane node (admin group, destructive)
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses: {"202": {description: removing}, "409": {$ref: "#/components/responses/Error"}}
  /api/v1/clusters/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get: {summary: Get cluster, responses: {"200": {description: cluster, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}, "404": {$ref: "#/components/responses/Error"}}}
    delete:
      summary: Delete a provisioned cluster, or disconnect an attached one (admin group)
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      responses: {"202": {description: deleting}, "409": {$ref: "#/components/responses/Error"}}
  /api/v1/clusters/{id}/upgrade:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      summary: Upgrade Kubernetes (admin group; capability, upgradeOwner and pre-flight enforced)
      parameters: [{$ref: "#/components/parameters/idempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kubernetesVersion], properties: {kubernetesVersion: {type: string}}}}}}
      responses:
        "202": {description: started, content: {application/json: {schema: {$ref: "#/components/schemas/Cluster"}}}}
        "409": {$ref: "#/components/responses/Error"}
        "412": {$ref: "#/components/responses/Error"}
  /api/v1/audit:
    get:
      summary: Audit trail, newest first
      parameters: [{name: limit, in: query, schema: {type: integer, maximum: 500}}]
      responses: {"200": {description: records, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AuditRecord"}}}}}}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: OIDC ID token}
    session: {type: apiKey, in: cookie, name: kubestack_session}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
    idempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
  responses:
    Error: {description: error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    Tier: {type: string, enum: [provisioned, hosted, attached]}
    UpgradeOwner: {type: string, enum: [kubestack, rancher, cloud, none]}
    Permission: {type: object, properties: {allowed: {type: boolean}, reason: {type: string}}}
    Cluster:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        tier: {$ref: "#/components/schemas/Tier"}
        upgradeOwner: {$ref: "#/components/schemas/UpgradeOwner"}
        kubernetesVersion: {type: string}
        ready: {type: boolean}
        operations: {type: object, properties: {upgrade: {$ref: "#/components/schemas/Permission"}, delete: {$ref: "#/components/schemas/Permission"}, register: {$ref: "#/components/schemas/Permission"}, snapshot: {$ref: "#/components/schemas/Permission"}, restore: {$ref: "#/components/schemas/Permission"}, removeNode: {$ref: "#/components/schemas/Permission"}, access: {$ref: "#/components/schemas/Permission"}}}
    Access:
      type: object
      properties:
        servers: {type: array, items: {type: string}}
        certificateAuthorityData: {type: string, description: base64 PEM; may be empty}
        oidc: {type: object, properties: {issuerURL: {type: string}, clientID: {type: string}}}
    Snapshot: {type: object, properties: {name: {type: string}, createdAt: {type: string, format: date-time}, successful: {type: boolean}}}
    Node: {type: object, properties: {name: {type: string}, ready: {type: boolean}, roles: {type: array, items: {type: string, enum: [etcd, controlplane, worker]}}}}
    Registration:
      type: object
      description: command contains the literal "{token}"; read the token from the referenced Secret with your own credentials.
      properties:
        command: {type: string}
        token: {type: object, properties: {namespace: {type: string}, name: {type: string}, key: {type: string}}}
    CreateRequest:
      type: object
      required: [name, kubernetesVersion]
      properties: {name: {type: string, pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"}, kubernetesVersion: {type: string}}
    AuditRecord:
      type: object
      properties: {id: {type: integer}, time: {type: string, format: date-time}, actor: {type: string}, action: {type: string}, clusterId: {type: string}, before: {type: object}, after: {type: object}, result: {type: string, enum: [attempt, success, failure]}, error: {type: string}}
    Error: {type: object, properties: {error: {type: string}, details: {type: array, items: {type: string}}}}
