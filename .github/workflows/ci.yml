name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: portal/package-lock.json}
      - run: cd portal && npm ci --no-audit --no-fund
      - run: make lint test license-check build test-integration helm-lint image
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: make e2e-matrix
